version: 2

models:
  - name: interactions
    description: Customer x asset buys per temporal split.
    data_tests:
      - dbt_utils_unique_combination:
          arguments:
            columns: [customer_id, isin, split]
    columns:
      - name: split
        data_tests:
          - accepted_values:
              arguments:
                values: ["train", "val", "test"]
      - name: n_buys
        data_tests: [not_null]

  - name: asset_price_coverage
    columns:
      - name: isin
        data_tests: [unique, not_null]

  - name: split_summary
