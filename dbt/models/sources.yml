version: 2

sources:
  - name: far_trans
    description: Raw FAR-Trans CSVs (University of Glasgow, CC-BY 4.0).
    meta:
      external_location: >-
        read_csv('{{ env_var("RECS_RAW_DIR", "../data/raw") }}/{name}.csv',
        header = true, auto_detect = true)
    tables:
      - name: transactions
      - name: asset_information
      - name: close_prices
      - name: customer_information
      - name: markets
      - name: limit_prices
