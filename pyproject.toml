[project]
name = "recs"
version = "0.1.0"
description = "Simple asset recommender on the FAR-Trans dataset"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "numpy>=2.0",
    "pandas>=2.2",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]
ignore = ["PD010", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["recs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::SyntaxWarning"]
